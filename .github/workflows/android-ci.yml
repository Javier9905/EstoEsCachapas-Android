name: Validación Android
on:
  push:
    branches: [ main, actividad-final-2026 ]
    paths-ignore:
      - 'Documentacion/**'
      - 'firebase/**'
      - 'firebase.json'
      - 'README.md'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar y ejecutar pruebas unitarias
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4.0.4
      - name: Instalar SDK Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK y ejecutar pruebas
        run: bash ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - name: Guardar APK de prueba
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EstoEsCachapas-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
